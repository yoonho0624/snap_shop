spring.application.name=shop

# 로컬(IDE) 실행 시 프로젝트 루트의 .env를 읽음. Docker에서는 compose가 환경변수로 주입
spring.config.import=optional:file:.env[.properties]

# DB 연결
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Base64로 인코딩한 32바이트(256비트) 이상의 랜덤 값
jwt.secret=${JWT_SECRET}
# Access Token 유효 시간 (밀리초): 1시간
jwt.access-token-expiration-ms=3600000

spring.jpa.properties.hibernate.default_batch_fetch_size=100

app.upload.dir=./uploads